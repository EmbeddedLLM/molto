name: Weekly OpenAI OpenAPI compatibility

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  openapi_compatibility:
    name: OpenAI OpenAPI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Fetch OpenAI OpenAPI specifications
        env:
          BASELINE_OPENAPI_URL: https://raw.githubusercontent.com/openai/openai-openapi/577fa92299e000af1616f3be1fec740e3383a86a/openapi.json
          LATEST_OPENAPI_URL: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.json
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "$BASELINE_OPENAPI_URL" \
            --output "$RUNNER_TEMP/openai-openapi-baseline.json"
          curl --fail --silent --show-error --location --retry 3 \
            "$LATEST_OPENAPI_URL" \
            --output "$RUNNER_TEMP/openai-openapi-latest.json"

      - name: Compare OpenAI API programmatic contracts
        run: |
          python scripts/compare_openai_openapi.py \
            "$RUNNER_TEMP/openai-openapi-baseline.json" \
            "$RUNNER_TEMP/openai-openapi-latest.json"

      # - name: Install package and test dependencies
