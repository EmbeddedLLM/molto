name: Weekly live provider API compatibility

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  live_provider_compatibility:
    name: Weekly live provider API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOLTO_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: uv pip install --system -e ".[test]"

      - name: Inspect pip packages
        run: uv pip list --system

      - name: Verify OpenAI credential is configured
        run: |
          if [[ -z "$MOLTO_OPENAI_API_KEY" ]]; then
            echo "MOLTO_OPENAI_API_KEY secret is not configured."
            exit 1
          fi

      - name: Run live provider compatibility suite
        run: python -m pytest --record-cassettes
