name: OpenAI OpenAPI compatibility

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openapi_compatibility:
    name: OpenAI OpenAPI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install schema conversion dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Resolve pinned and latest OpenAI SDK releases
        id: sdk_releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/openai/openai-python/releases/latest \
            --output "$RUNNER_TEMP/openai-sdk-latest-release.json"
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          test_dependencies = project["project"]["optional-dependencies"]["test"]
          version = next(
              dependency.removeprefix("openai==")
              for dependency in test_dependencies
              if dependency.startswith("openai==")
          )
          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "openai-sdk-latest-release.json").read_text()
          )
          baseline, latest = f"v{version}", release["tag_name"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"baseline={baseline}", file=output)
              print(f"latest={latest}", file=output)
          print(f"Comparing OpenAI SDK schemas: {baseline} -> {latest}")
          PY

      - name: Fetch and convert SDK release schemas
        env:
          BASELINE_SDK_TAG: ${{ steps.sdk_releases.outputs.baseline }}
          LATEST_SDK_TAG: ${{ steps.sdk_releases.outputs.latest }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/openai/openai-python/$BASELINE_SDK_TAG/api_reference/openapi.transformed.yml" \
            --output "$RUNNER_TEMP/openai-openapi-baseline.yml"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/openai/openai-python/$LATEST_SDK_TAG/api_reference/openapi.transformed.yml" \
            --output "$RUNNER_TEMP/openai-openapi-latest.yml"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          directory = Path(os.environ["RUNNER_TEMP"])
          for name in ("baseline", "latest"):
              source = directory / f"openai-openapi-{name}.yml"
              document = yaml.safe_load(source.read_text())
              # YAML dates must remain strings in the OpenAPI JSON document.
              (directory / f"openai-openapi-{name}.json").write_text(json.dumps(document, default=str))
          PY

      - name: Compare OpenAI API programmatic contracts
        run: |
          python scripts/compare_openai_openapi.py \
            "$RUNNER_TEMP/openai-openapi-baseline.json" \
            "$RUNNER_TEMP/openai-openapi-latest.json"
