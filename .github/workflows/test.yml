name: Unit tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  offline_replay:
    name: Unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Replay test suite
        run: pytest

      - name: Verify cassettes are unchanged
        if: always()
        run: |
          if [[ -n "$(git status --porcelain -- tests/cassettes)" ]]; then
            git status --short -- tests/cassettes
            exit 1
          fi
