name: Probe Gemini signature placement

on:
  push:
    branches:
      - record/gemini-cassettes-20261105
    paths:
      - .github/workflows/record-gemini-cassettes.yml
      - scripts/probe_gemini_signatures.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install pinned native SDK
        run: python -m pip install openai==2.53.0
      - name: Compare signature attachments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/probe_gemini_signatures.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gemini-signature-probe-results
          path: /tmp/molto-gemini-signature-probe-results.json
          retention-days: 1
