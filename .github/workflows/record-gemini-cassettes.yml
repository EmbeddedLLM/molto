name: Record Gemini cassettes

on:
  push:
    branches:
      - record/gemini-cassettes-20261105
    paths:
      - .github/workflows/record-gemini-cassettes.yml
      - scripts/record_gemini_cassettes.py

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recording branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install recording dependencies
        run: uv pip install --system -e ".[test]"
      - name: Record native SDK conversations
        env:
          GEMINI_API_KEY: ${{ secrets.MOLTO_GEMINI_RECORDING_KEY }}
        run: python -m scripts.record_gemini_cassettes
      - name: Upload sanitized cassettes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gemini-chat-cassettes
          path: gemini-recordings/**/*.yaml
          if-no-files-found: error
          retention-days: 7
