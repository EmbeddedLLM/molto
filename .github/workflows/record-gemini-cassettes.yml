name: Record Gemini combined reasoning history

on:
  push:
    branches:
      - record/gemini-cassettes-20261105
    paths:
      - .github/workflows/record-gemini-cassettes.yml
      - scripts/probe_gemini_combined_history.py

permissions:
  contents: read
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install recording dependencies
        run: python -m pip install openai==2.53.0 fastapi[standard]==0.135.4 PyYAML==6.0.3 loguru==0.7.3 uuid-utils==0.14.1
      - name: Download verified assistant histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44276479795 --name gemini-combined-history --dir /tmp/molto-gemini-history-seeds
      - name: Record native reasoning continuation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: .
        run: python scripts/probe_gemini_combined_history.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gemini-combined-history
          path: /tmp/molto-gemini-combined-history
          retention-days: 7
