name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  offline_replay:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      MOLTO_OPENAI_API_KEY: "DUMMY_KEY"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest tests

      - name: Verify cassettes are unchanged
        if: always()
        run: |
          if [[ -n "$(git status --porcelain -- tests/cassettes)" ]]; then
            git status --short -- tests/cassettes
            exit 1
          fi
