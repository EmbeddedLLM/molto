name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline_replay:
    name: Unit tests (Python ${{ matrix.python-version }})
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      OPENAI_API_KEY: "DUMMY_KEY"

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Python version selected by uv
        run: |
          uv_python="$(uv python find --system --no-project)"
          echo "$uv_python"
          "$uv_python" -VV

      # Runs before the test extras are installed, because they can transitively
      # provide an undeclared runtime dependency (fastapi[standard] pulls in PyYAML).
      - name: Check import with core dependencies only
        run: |
          uv pip install --system -e .
          python -c "import molto"

      - name: Install package and test dependencies
        run: uv pip install --system -e ".[test]"

      - name: Inspect pip packages
        run: uv pip list --system

      - name: Run tests
        run: |
          python -m pytest --cov=python/molto --cov-report=term-missing \
            --cov-report=xml:coverage.xml --junitxml=junit/pytest.xml

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@4a4889e6085d4e19fd19bf4a763c83d5332c8d06 # v1.9.0
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage.xml') != '' && hashFiles('junit/pytest.xml') != ''
        continue-on-error: true
        with:
          pytest-xml-coverage-path: coverage.xml
          coverage-path-prefix: python/molto/
          junitxml-path: junit/pytest.xml
          title: Coverage Report (Python ${{ matrix.python-version }})
          unique-id-for-comment: coverage-python-${{ matrix.python-version }}
          report-only-changed-files: true

      - name: Verify cassettes are unchanged
        if: always()
        run: |
          if [[ -n "$(git status --porcelain -- tests/cassettes)" ]]; then
            git status --short -- tests/cassettes
            exit 1
          fi
