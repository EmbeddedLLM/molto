        *   **6** = 2 × 3

        *   **8** = 2³

        *   **9** = 3²


        To calculate the LCM, take the highest power of each prime factor that appears
        in any of the factorizations:

        *   The highest power of **2** is 2³ (which is 8).

        *   The highest power of **3** is 3² (which is 9).


        Multiply these together: **8 × 9 = 72**.'
