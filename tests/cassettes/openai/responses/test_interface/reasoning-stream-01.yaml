  - 'data: {"type":"response.output_text.done","content_index":0,"item_id":"msg_02b0fed16e071f1d006a70b614cab0819990db0075879343bf","logprobs":[],"output_index":1,"sequence_number":265,"text":"The
    **700-pound figure is a folklore-based estimate**, not a measured fact.\n\nThe
    reasoning goes roughly like this:\n\n1. A woodchuck—also called a groundhog—can
    excavate a substantial burrow.\n2. Someone estimated the amount of soil displaced
    while digging such a burrow.\n3. They then jokingly treated that volume as if
    it were wood and converted it to a weight—roughly **700 pounds (318 kg)**.\n4.
    The result became the familiar answer to the tongue twister.\n\nIn reality, woodchucks
    **dig and move soil, not wood**, and their burrows vary widely. So the scientifically
    careful answer is: **there’s no established amount; the woodchuck would chuck
    as much wood as it could.**"}

