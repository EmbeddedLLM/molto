    here are two common patterns for “fixture-backed stream” errors—one in Python
    and one in Node.js—so you can adapt it to your setup.\n\nPython (pytest) — fixture
    that returns a stream which raises an error after a point\n- Goal: simulate a
    stream that yields data, then raises an error when read again.\n\nExample\n\n-
    A small stream class that raises after a limit:\n  - \n  - \n  - \n  - \nCode:\n  -
    \nclass FixtureErrorStream(io.RawIOBase):\n    def __init__(self, data=b\"\",
    error_after=None, exc=None):\n        self._buffer = data\n        self._pos =
    0\n        self._error_after = error_after\n        self._exc = exc or IOError(\"fixture-backed
    stream error\")\n\n    def read(self, size=-1):\n        if self._error_after
    is not None and self._pos >= self._error_after:\n            raise self._exc\n        if
    size == -1:\n            size = len(self._buffer) - self._pos\n        if self._pos
    >= len(self._buffer):\n            return b''''\n        chunk = self._buffer[self._pos:self._pos+size]\n        self._pos
    += len(chunk)\n        return chunk\n\nFixture and test:\n\n  - \nimport pytest\n\n@pytest.fixture\ndef
    error_stream_fixture():\n    data = b''hello world''\n    return FixtureErrorStream(data,
    error_after=5, exc=IOError(\"stream error from fixture\"))\n\ndef test_consumes_stream_and_receives_error(error_stream_fixture):\n    s
    = error_stream_fixture\n    first = s.read(5)\n    assert first == b''hello''\n    with
    pytest.raises(IOError) as excinfo:\n        s.read(1024)\n    assert \"stream
    error\" in str(excinfo.value)\n\nNode.js (mocha/jest) — fixture-backed Readable
    stream that emits an error\n- Goal: simulate a stream that outputs some data,
