    } = require(''stream'');\n\nfunction fixtureBackedStreamWithError() {\n  let emitted
    = false;\n  const s = new Readable({\n    read() {\n      if (!emitted) {\n        this.push(''hello'');\n        emitted
    = true;\n      } else {\n        // simulate an error on subsequent read\n        this.destroy(new
    Error(''fixture-backed stream error''));\n      }\n    }\n  });\n  return s;\n}\n\nTest
    (jest):\n\ntest(''stream emits data then errors'', done => {\n  const s = fixtureBackedStreamWithError();\n  let
    data = '''';\n  s.on(''data'', chunk => { data += chunk; });\n  s.on(''error'',
    err => {\n    expect(err).toBeInstanceOf(Error);\n    expect(err.message).toBe(''fixture-backed
    stream error'');\n    done();\n  });\n  s.on(''end'', () => {\n    done(new Error(''unexpected
    end''));\n  });\n});\n\nIf you can share:\n- the language (Python, JavaScript,
