# -----------------------------------------------------------------------------
# Pytest configuration
# https://docs.pytest.org/en/latest/customize.html?highlight=pyproject#pyproject-toml

[tool.pytest.ini_options]
timeout = 90
log_cli = true
asyncio_mode = "auto"
addopts = "--doctest-modules -vv -ra --strict-markers --durations=200 --durations-min=0.05"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:tensorflow.*",
    "ignore::DeprecationWarning:tensorboard.*",
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::DeprecationWarning:flatbuffers.*",
]

# -----------------------------------------------------------------------------
# Ruff configuration
# https://docs.astral.sh/ruff/

[tool.ruff]
line-length = 99
indent-width = 4
target-version = "py312"
extend-include = [".pyi?$", ".ipynb"]
extend-exclude = ["archive/*"]
respect-gitignore = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E1", "E4", "E7", "E9", "F", "I", "W1", "W2", "W3", "W6", "B"]
ignore = ["E501"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["molto"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Query",
]

# -----------------------------------------------------------------------------
# setuptools
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html

[build-system]
requires = ["setuptools>=62.0"]
build-backend = "setuptools.build_meta"

[project]
name = "molto"
description = "Molto: A unified LLM-provider translation library."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
# The anthropic and openai windows are the version ranges that the offline replay suite passes on.
# The openai floor is a hard import requirement, not a preference;
# the ceilings are releases where tests start failing.
# Re-derive from the suite before widening either bound; see AGENTS.md, "Dependency Versions".
# The test extra pins the exact versions the suite is developed against.
dependencies = [
    "anthropic>=0.119.0,<0.124",
    "loguru~=0.7",
    "openai>=3.21.0,<=3.24.0",
    "orjson~=3.11",
    "pycountry~=26.2.16",
    "pydantic-ai-slim[retries]~=1.104.0",
    "pydantic-extra-types~=2.11.1",
    "pydantic-settings~=2.13.1",
    "pydantic[email,timezone]>=2.13.4",
    "uuid-utils~=0.14.1",
]
dynamic = ["version"]

[project.optional-dependencies]
lint = ["ruff~=0.12"]
# Exact SDK versions the suite is developed and verified against. Keep these
# inside the windows declared in the core dependencies.
test = [
    "anthropic==0.121.0",
    "fastapi[standard]~=0.135.2",
    "openai==3.22.1",
    "pytest~=8.3",
    "pytest-asyncio>=0.23.8",
    "pytest-timeout~=2.3",
]
all = ["molto[lint,test]"]

[tool.setuptools.dynamic]
version = { attr = "molto.version.__version__" }

[tool.setuptools.packages.find]
where = ["python"]
